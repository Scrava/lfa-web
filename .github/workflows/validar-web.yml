name: Validar web LFA
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'enhancements.js'
      - 'edition.js'
      - 'mobile.js'
      - 'rivalries.js'
      - 'rivalry-core.js'
      - 'scripts/test-rivalries.cjs'
      - 'data/live_bootstrap.js'
      - 'index.html'
      - 'styles.css'
      - '.github/workflows/validar-web.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxis JavaScript
        run: |
          node --check app.js
          node --check enhancements.js
          node --check edition.js
          node --check mobile.js
          node --check rivalries.js
          node --check rivalry-core.js
          node --check scripts/test-rivalries.cjs
          node --check data/live_bootstrap.js
      - name: Verificar recursos principales
        run: |
          test -f index.html
          test -f styles.css
          test -f mobile.js
          test -f rivalries.js
          test -f rivalry-core.js
          test -f scripts/test-rivalries.cjs
          test -f data/bootstrap.js
          test -f data/live_snapshot.json
          test -f data/player_catalog.json
          node - <<'NODE'
          const fs=require('fs');const vm=require('vm');
          const env={window:{}};
          vm.runInNewContext(fs.readFileSync('data/live_bootstrap.js','utf8'),env);
          const snap=env.window.LFA_INITIAL_SNAPSHOT;
          if(String(snap?.league_id)!=='1388976988894543872'||snap.rosters.length!==8||!Object.keys(snap.matchups).length)throw Error('El respaldo LFA no es válido');
          console.log('Respaldo LFA verificado, semana',snap.week);
          const html=fs.readFileSync('index.html','utf8');
          const css=fs.readFileSync('styles.css','utf8');
          const mobile=fs.readFileSync('mobile.js','utf8');
          for(const id of ['mobileMenuToggle','mobileDockMenu','mobileDock','mobileNavBackdrop','mainNavigation']){
            if(!html.includes('id="'+id+'"'))throw Error('Falta control movil '+id);
          }
          if(!html.includes('src="mobile.js"')||!css.includes('.mobile-stack-table')||!css.includes('.mobile-draft-board')||!mobile.includes('MutationObserver'))throw Error('Recursos responsivos incompletos');
          const rivalry=fs.readFileSync('rivalries.js','utf8');
          const bootstrap=fs.readFileSync('data/bootstrap.js','utf8');
          const ctx={window:{}};vm.runInNewContext(bootstrap,ctx);
          const pairs=ctx.window.LFA_DATA?.legacy_h2h_review||[];
          if(pairs.length!==28 || new Set(pairs.map(p=>[p.franchise_a_id,p.franchise_b_id].sort().join('|'))).size!==28)throw Error('Matriz histórica incompleta');
          if(!html.includes('id="rivalryMatrix"')||!html.includes('src="rivalries.js"')||!rivalry.includes('matrix-cell'))throw Error('Falta matriz de rivalidades');
          if(!css.includes('.mobile-compact-table')||!css.includes('.paper-grid'))throw Error('Faltan tablas compactas');
          console.log('Navegación móvil, 28 cruces y estilos compactos verificados.');
          NODE
      - name: Probar consistencia del cuadro y buscador de paternidades
        run: node scripts/test-rivalries.cjs
