name: Validar web LFA
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'enhancements.js'
      - 'edition.js'
      - 'mobile.js'
      - 'rivalries.js'
      - 'rivalry-core.js'
      - 'lfa-stats-core.js'
      - 'lfa-v6.js'
      - 'lfa-live-refresh.js'
      - 'lfa-season-ui.js'
      - 'scripts/season_manager.py'
      - 'scripts/sync_sleeper.py'
      - 'scripts/test-season-manager.py'
      - 'data/league.json'
      - 'data/bootstrap.js'
      - 'data/seasons.json'
      - 'data/archive/**'
      - 'scripts/test-v6.cjs'
      - 'scripts/test-live-refresh.cjs'
      - 'scripts/test-rivalries.cjs'
      - 'scripts/test-ten-teams.cjs'
      - 'scripts/test-ten-teams.py'
      - 'data/live_bootstrap.js'
      - 'index.html'
      - 'styles.css'
      - '.github/workflows/validar-web.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxis JavaScript
        run: |
          node --check app.js
          node --check enhancements.js
          node --check edition.js
          node --check mobile.js
          node --check rivalries.js
          node --check rivalry-core.js
          node --check lfa-stats-core.js
          node --check lfa-v6.js
          node --check lfa-live-refresh.js
          node --check lfa-season-ui.js
          node --check scripts/test-v6.cjs
          node --check scripts/test-live-refresh.cjs
          node --check scripts/test-rivalries.cjs
          node --check scripts/test-ten-teams.cjs
          node --check data/live_bootstrap.js
      - name: Verificar recursos principales
        run: |
          test -f index.html
          test -f styles.css
          test -f mobile.js
          test -f rivalries.js
          test -f rivalry-core.js
          test -f scripts/test-rivalries.cjs
          test -f data/bootstrap.js
          test -f data/live_snapshot.json
          test -f data/player_catalog.json
          node - <<'NODE'
          const fs=require('fs');const vm=require('vm');
          const env={window:{}};
          vm.runInNewContext(fs.readFileSync('data/live_bootstrap.js','utf8'),env);
          const snap=env.window.LFA_INITIAL_SNAPSHOT;
          const cfg=JSON.parse(fs.readFileSync('data/league.json','utf8'));
          const teamCount=Number(cfg.current_teams||8);
          if(![8,10].includes(teamCount)||String(snap?.league_id)!==String(cfg.sleeper_league_id)
             ||snap.rosters.length!==teamCount||snap.league?.season!=cfg.current_season
             ||(!Object.keys(snap.matchups||{}).length&&!['pre_draft','drafting'].includes(snap.league?.status)))
            throw Error('El respaldo LFA no es válido');
          console.log('Respaldo LFA verificado, semana',snap.week);
          const html=fs.readFileSync('index.html','utf8');
          const css=fs.readFileSync('styles.css','utf8');
          const mobile=fs.readFileSync('mobile.js','utf8');
          for(const id of ['mobileMenuToggle','mobileDockMenu','mobileDock','mobileNavBackdrop','mainNavigation']){
            if(!html.includes('id="'+id+'"'))throw Error('Falta control movil '+id);
          }
          if(!html.includes('src="mobile.js"')||!css.includes('.mobile-stack-table')||!css.includes('.mobile-draft-board')||!mobile.includes('MutationObserver'))throw Error('Recursos responsivos incompletos');
          const rivalry=fs.readFileSync('rivalries.js','utf8');
          const bootstrap=fs.readFileSync('data/bootstrap.js','utf8');
          const ctx={window:{}};vm.runInNewContext(bootstrap,ctx);
          const pairs=ctx.window.LFA_DATA?.legacy_h2h_review||[];
          const expected=teamCount*(teamCount-1)/2;
          if(ctx.window.LFA_DATA?.franchises?.length!==teamCount||pairs.length!==expected
             ||new Set(pairs.map(p=>[p.franchise_a_id,p.franchise_b_id].sort().join('|'))).size!==expected)
            throw Error('Matriz histórica incompleta');
          if(!html.includes('id="rivalryMatrix"')||!html.includes('src="rivalries.js"')||!rivalry.includes('matrix-cell'))throw Error('Falta matriz de rivalidades');
          if(!css.includes('.mobile-compact-table')||!css.includes('.paper-grid'))throw Error('Faltan tablas compactas');
          console.log('Navegación móvil, '+expected+' cruces y estilos compactos verificados.');
          NODE
      - name: Probar consistencia del cuadro y buscador de paternidades
        run: node scripts/test-rivalries.cjs
      - name: Verificar continuidad entre temporadas
        run: |
          python -m py_compile scripts/season_manager.py scripts/sync_sleeper.py
          python scripts/test-season-manager.py -v
          python scripts/test-ten-teams.py -v
      - name: Comprobar escenarios de 8 y 10 franquicias
        run: node scripts/test-ten-teams.cjs
      - name: Probar refresco en vivo sin publicar en Netlify
        run: node scripts/test-live-refresh.cjs
      - name: Probar edición LFA 8 y funciones NFL
        run: node scripts/test-v6.cjs
