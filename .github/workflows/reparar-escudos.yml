name: Restaurar negro de los escudos LFA
on:
  push:
    branches: [main]
    paths:
      - 'scripts/reparar_escudos.py'
      - '.github/workflows/reparar-escudos.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lfa-escudos
  cancel-in-progress: false
jobs:
  reparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar librerías de imagen
        run: python -m pip install Pillow numpy opencv-python-headless
      - name: Restaurar las zonas negras originales
        run: python scripts/reparar_escudos.py
      - name: Guardar únicamente los escudos modificados
        run: |
          git config user.name "LFA artwork bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/cougars.webp assets/scravengers.webp assets/nakillers.webp assets/boom-or-bust.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets: restaurar zonas negras internas de cuatro escudos"
            git push
          fi
