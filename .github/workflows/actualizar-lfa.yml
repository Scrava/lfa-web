name: Actualizar LFA desde Sleeper
on:
  schedule:
    - cron: '17 12 * * 2'  # Respaldo semanal: martes 12:17 UTC (09:17 Argentina); puede retrasarse
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lfa-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar Sleeper y actualizar los JSON
        run: python scripts/sync_sleeper.py
      - name: Archivar final y comprobar la próxima liga
        run: python scripts/season_manager.py
      - name: Actualizar la nueva liga cuando exista
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          cfg=json.loads(Path('data/league.json').read_text())
          snap=json.loads(Path('data/live_snapshot.json').read_text())
          if str(snap['league_id']) != str(cfg['sleeper_league_id']):
              subprocess.run(['python','scripts/sync_sleeper.py'],check=True)
          PY
      - name: Publicar cambios verificables
        run: |
          git config user.name "LFA data bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualizar archivo y temporada activa de LFA"
            git push
          fi
