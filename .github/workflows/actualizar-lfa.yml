name: Actualizar LFA desde Sleeper
on:
  schedule:
    - cron: '17 */6 * * *'  # Cada 6 horas UTC; puede retrasarse por carga de GitHub Actions
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lfa-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar Sleeper y actualizar los JSON
        run: python scripts/sync_sleeper.py
      - name: Publicar cambios verificables
        run: |
          git config user.name "LFA data bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live_snapshot.json data/auto_news.json data/player_catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualizar Sleeper LFA 2026"
            git push
          fi
